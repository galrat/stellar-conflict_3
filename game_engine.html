<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR CONFLICT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap');
:root{
  --bg:#050a14;--panel:#0a1628;--border:#1a3a5c;
  --accent1:#00c8ff;--accent2:#ff4d6d;--gold:#ffd700;
  --text:#c8e0f0;--dim:#4a6a8a;--p1:#00c8ff;--p2:#ff4d6d;
  --planet:#0a1e10;--space:#060e1a;--cell:160px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(0,200,255,.04),transparent 60%),radial-gradient(ellipse at 80% 50%,rgba(255,77,109,.04),transparent 60%);pointer-events:none;}
h1,h2,h3{font-family:'Orbitron',monospace;}
.screen{display:none;}.screen.active{display:flex;flex-direction:column;}

/* ── SETUP ── */
#setup-screen{min-height:100vh;align-items:center;justify-content:center;padding:20px;gap:6px;}
.game-title{font-size:clamp(2rem,6vw,3.8rem);font-weight:900;letter-spacing:.2em;text-align:center;background:linear-gradient(135deg,var(--p1),#fff,var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.game-subtitle{text-align:center;letter-spacing:.5em;color:var(--dim);font-size:.85rem;margin-bottom:22px;text-transform:uppercase;}
.setup-players{display:grid;grid-template-columns:1fr 1fr;gap:22px;width:100%;max-width:980px;}
.player-setup{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;position:relative;overflow:hidden;}
.player-setup::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.player-setup.ps1::before{background:var(--p1);}.player-setup.ps2::before{background:var(--p2);}
.player-label{font-family:'Orbitron',monospace;font-size:.7rem;letter-spacing:.3em;margin-bottom:14px;text-transform:uppercase;}
.ps1 .player-label{color:var(--p1);}.ps2 .player-label{color:var(--p2);}
.field-group{margin-bottom:14px;}
.field-label{font-size:.7rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin-bottom:6px;}
input[type=text]{width:100%;background:#060e1a;border:1px solid var(--border);border-radius:6px;padding:8px 12px;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:1rem;outline:none;transition:border-color .2s;}
input[type=text]:focus{border-color:var(--p1);}
.faction-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.faction-btn{background:#060e1a;border:1px solid var(--border);border-radius:8px;padding:10px 6px;cursor:pointer;transition:all .2s;text-align:center;color:var(--text);position:relative;}
.faction-btn:hover{border-color:var(--dim);}
.faction-btn.sel1{border-color:var(--p1);background:rgba(0,200,255,.1);color:var(--p1);}
.faction-btn.sel2{border-color:var(--p2);background:rgba(255,77,109,.1);color:var(--p2);}
.faction-btn.taken{opacity:.3;cursor:not-allowed;pointer-events:none;}
.faction-btn.taken::after{content:'ЗАНЯТО';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.5rem;letter-spacing:.15em;color:var(--dim);background:rgba(5,10,20,.75);border-radius:7px;}
.fi{font-size:1.4rem;display:block;margin-bottom:3px;}
.fn{font-size:.78rem;font-weight:600;letter-spacing:.08em;}
.ff{font-size:.6rem;color:var(--dim);margin-top:2px;}
.fres{font-size:.58rem;color:var(--dim);margin-top:4px;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
.start-btn{margin-top:18px;width:100%;max-width:980px;padding:14px;background:linear-gradient(135deg,rgba(0,200,255,.12),rgba(255,77,109,.12));border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Orbitron',monospace;font-size:.85rem;letter-spacing:.2em;cursor:pointer;transition:all .3s;text-transform:uppercase;}
.start-btn:hover{background:linear-gradient(135deg,rgba(0,200,255,.25),rgba(255,77,109,.25));border-color:var(--p1);transform:translateY(-1px);}

/* ── GAME ── */
#game-screen{height:100vh;padding:6px;gap:5px;overflow:hidden;}
.game-header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:5px 14px;background:var(--panel);border:1px solid var(--border);border-radius:10px;gap:10px;flex-shrink:0;}
.pinfo{display:flex;align-items:center;gap:10px;}.pinfo.r{justify-content:flex-end;}
.pavatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.7rem;font-weight:700;border:2px solid;flex-shrink:0;}
.av1{border-color:var(--p1);background:rgba(0,200,255,.1);color:var(--p1);}
.av2{border-color:var(--p2);background:rgba(255,77,109,.1);color:var(--p2);}
.pstats{line-height:1.3;}
.pname{font-family:'Orbitron',monospace;font-size:2.1rem;font-weight:700;}
.s1 .pname{color:var(--p1);}.s2 .pname{color:var(--p2);}
.pfac{font-size:1.4rem;color:var(--dim);}
.ptroops{font-size:.78rem;color:var(--dim);}
.ptnum{font-weight:700;}.s1 .ptnum{color:var(--p1);}.s2 .ptnum{color:var(--p2);}
.pres{font-size:1.4rem;color:var(--dim);margin-top:2px;letter-spacing:.04em;}
.phase-info{text-align:center;}
.phase-lbl{font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:.3em;color:var(--dim);text-transform:uppercase;}
.phase-name{font-family:'Orbitron',monospace;font-size:.78rem;color:var(--gold);white-space:nowrap;}
.round-info{font-size:.68rem;color:var(--dim);margin-top:2px;}
.turn-ind{padding:3px 9px;border-radius:20px;font-size:.62rem;font-family:'Orbitron',monospace;letter-spacing:.1em;}
.ti1{background:rgba(0,200,255,.15);color:var(--p1);border:1px solid rgba(0,200,255,.3);}
.ti2{background:rgba(255,77,109,.15);color:var(--p2);border:1px solid rgba(255,77,109,.3);}

/* ── LAYOUT ── */
.game-content{display:grid;grid-template-columns:195px 1fr 195px;gap:5px;flex:1;min-height:0;overflow:hidden;}
.side-panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:7px;overflow:hidden;}
.ptitle{font-family:'Orbitron',monospace;font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--border);padding-bottom:5px;}

/* hand tiles */
.tile-hand{display:flex;flex-direction:column;gap:5px;}
.htile{background:#060e1a;border:1px solid var(--border);border-radius:7px;padding:7px;cursor:pointer;transition:all .2s;position:relative;}
.htile:hover{border-color:var(--dim);}
.htile.hs1{border-color:var(--p1);background:rgba(0,200,255,.07);box-shadow:0 0 8px rgba(0,200,255,.2);}
.htile.hs2{border-color:var(--p2);background:rgba(255,77,109,.07);box-shadow:0 0 8px rgba(255,77,109,.2);}
.htile.hthome{border-style:dashed;}
.hpreview{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;aspect-ratio:1;margin-bottom:3px;}
.hpa{border-radius:2px;border:1px solid rgba(255,255,255,.07);}
.hpa.hpp{background:rgba(0,120,40,.15);border-color:rgba(0,200,80,.2);}
.hpa.hps{background:rgba(0,30,80,.2);border-color:rgba(0,80,200,.15);}
.htlabel{font-size:.65rem;color:var(--dim);text-align:center;}

/* troop pool */
.pool-sec{display:flex;flex-direction:column;gap:3px;}
.pool-type-lbl{font-size:.58rem;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
.tpool{display:flex;flex-wrap:wrap;gap:3px;}
.ttok{width:39px;height:39px;display:flex;align-items:center;justify-content:center;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .15s;border:2px solid;user-select:none;}
.ttok.ground{border-radius:50%;}
.ttok.space{border-radius:3px;}
.ttok.c1{background:rgba(0,200,255,.15);border-color:var(--p1);color:var(--p1);}
.ttok.stok{border-radius:4px;font-size:1.1rem;}
.astruc{width:33px;height:33px;display:inline-flex;align-items:center;justify-content:center;font-size:1.15rem;border-radius:3px;border:2px solid;margin:1px;}
.ttok.c2{background:rgba(255,77,109,.15);border-color:var(--p2);color:var(--p2);}
.ttok.sel{transform:scale(1.2);box-shadow:0 0 7px currentColor;}
.ttok:hover{transform:scale(1.1);}


/* log */
.alog{font-size:.7rem;line-height:1.5;color:var(--dim);overflow-y:auto;flex:1;max-height:220px;}
.le{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.025);}
.le1{color:rgba(0,200,255,.85);}.le2{color:rgba(255,77,109,.85);}.les{color:var(--gold);}

/* ── MAP ── */
.map-container{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;overflow:auto;min-height:0;}
.map-board{position:relative;}
.drop-cell{position:absolute;border:2px solid var(--p1);background:rgba(0,200,255,.05);border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;animation:pc .9s ease-in-out infinite;}
.drop-cell:hover{background:rgba(0,200,255,.13);}
@keyframes pc{0%,100%{box-shadow:0 0 4px rgba(0,200,255,.2);}50%{box-shadow:0 0 14px rgba(0,200,255,.5);}}

/* tile */
.stile{position:absolute;border-radius:8px;overflow:visible;}
.stile-bg{position:absolute;inset:0;border-radius:8px;overflow:hidden;z-index:0;pointer-events:none;}
.stile-bg-img{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:center;}
.stile::before{content:'';position:absolute;inset:0;border-radius:8px;background:rgba(2,8,18,.38);z-index:1;pointer-events:none;}
.stilei{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:3px;background:transparent;border-radius:8px;position:relative;z-index:2;}
.stile.hp1{box-shadow:inset 0 0 0 2px var(--p1),0 0 14px rgba(0,200,255,.2);}
.stile.hp2{box-shadow:inset 0 0 0 2px var(--p2),0 0 14px rgba(255,77,109,.2);}
.stile.np1{box-shadow:inset 0 0 0 1px rgba(0,200,255,.3);}
.stile.np2{box-shadow:inset 0 0 0 1px rgba(255,77,109,.3);}
.stile.just{box-shadow:inset 0 0 0 2px var(--gold),0 0 12px rgba(255,215,0,.25);}
.hbadge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:1.6rem;color:var(--gold);z-index:5;pointer-events:none;text-shadow:0 2px 8px #000,0 0 6px #000;}
.tcoord{position:absolute;top:4px;right:5px;font-size:.8rem;font-family:'Orbitron',monospace;color:var(--dim);z-index:5;pointer-events:none;text-shadow:0 1px 3px #000;}

/* area */
.tarea{border:1px solid rgba(255,255,255,.22);border-radius:3px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:1px;padding:2px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden;}
.tarea.aplanet{background:rgba(10,30,16,.12);}
.tarea.aspace{background:rgba(6,14,40,.12);}
.tarea.aplanet::after{content:'🪐';position:absolute;bottom:2px;right:3px;font-size:1rem;opacity:.7;pointer-events:none;}
.tarea.aspace::after{content:'✦';position:absolute;bottom:2px;right:3px;font-size:1rem;opacity:.6;color:#88aaff;pointer-events:none;}
.tarea:hover{border-color:var(--dim);}
.tarea.aok{border-color:var(--p1);animation:adp .8s ease-in-out infinite;cursor:pointer;}
.tarea.aok:hover{background:rgba(0,200,255,.1);}
.tarea.ano{opacity:.3;cursor:not-allowed;}
@keyframes adp{0%,100%{box-shadow:inset 0 0 3px rgba(0,200,255,.3);}50%{box-shadow:inset 0 0 8px rgba(0,200,255,.5);}}
.tarea.h1{border-color:rgba(0,200,255,.4);}.tarea.h2{border-color:rgba(255,77,109,.4);}
.tarea.contested{border-color:#ff9500;animation:bat .45s ease-in-out infinite;}
@keyframes bat{0%,100%{background:rgba(255,149,0,.05);}50%{background:rgba(255,149,0,.15);}}
.atlbl{position:absolute;top:2px;left:4px;font-size:1.1rem;pointer-events:none;opacity:.95;z-index:3;letter-spacing:.05em;text-shadow:0 1px 5px #000,0 0 4px #000;}
.acap{position:absolute;bottom:2px;right:4px;font-size:1rem;font-family:'Orbitron',monospace;color:var(--dim);pointer-events:none;z-index:3;text-shadow:0 1px 4px #000;}
.atroop{width:33px;height:33px;display:flex;align-items:center;justify-content:center;font-size:.87rem;font-weight:700;border:1px solid;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.8);}
.atroop.ground{border-radius:50%;}
.atroop.space{border-radius:2px;}
.atroop.c1{background:#001d28;border-color:var(--p1);color:var(--p1);}
.atroop.c2{background:#28000e;border-color:var(--p2);color:var(--p2);}
.opip{position:absolute;width:11px;height:11px;border-radius:50%;font-size:.38rem;font-family:'Orbitron',monospace;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.8);}
.opip.op1{background:rgba(0,200,255,.75);color:#001820;border:1px solid var(--p1);top:1px;right:1px;}
.opip.op2{background:rgba(255,77,109,.75);color:#200010;border:1px solid var(--p2);bottom:1px;left:1px;}
/* Подсветка тайла при выборе тайла для приказа */
.stile.tok{box-shadow:0 0 0 3px rgba(0,200,255,.9),inset 0 0 16px rgba(0,200,255,.18);animation:adp .8s ease-in-out infinite;cursor:pointer;}
.stile.tno{opacity:.25;}
/* Жетон приказа (шестиугольник) */
.order-fd{
  position:absolute;
  width:50px;
  height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:2px;
  font-family:'Orbitron',monospace;
  pointer-events:none;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 10px rgba(0,0,0,.85);
  border:2px solid;
  clip-path:polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
}
.order-fd.clickable{pointer-events:auto;cursor:pointer;animation:adp .8s ease-in-out infinite;border-width:3px;}
.order-fd.clickable:hover{filter:brightness(1.4);}

/* ── BOTTOM BAR ── */
.bottom-bar{display:flex;gap:5px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:5px 10px;flex-shrink:0;overflow-x:auto;}
#btn-et{margin-left:auto;}
.pinstr{flex:1;font-size:.8rem;color:var(--text);line-height:1.4;min-width:200px;}
.pinstr strong{color:var(--gold);font-family:'Orbitron',monospace;font-size:.65rem;}
.abtn{padding:8px 13px;border-radius:8px;font-family:'Orbitron',monospace;font-size:.6rem;letter-spacing:.1em;cursor:pointer;border:1px solid;transition:all .2s;text-transform:uppercase;white-space:nowrap;}
.bp{background:rgba(0,200,255,.1);border-color:var(--p1);color:var(--p1);}.bp:hover{background:rgba(0,200,255,.22);}
.bg{background:rgba(255,215,0,.1);border-color:var(--gold);color:var(--gold);}.bg:hover{background:rgba(255,215,0,.22);}
.br{background:rgba(255,77,109,.1);border-color:var(--p2);color:var(--p2);}.br:hover{background:rgba(255,77,109,.22);}
.bw{background:rgba(255,140,0,.1);border-color:#ff8c00;color:#ff8c00;}.bw:hover{background:rgba(255,140,0,.22);}

/* ── MODALS ── */
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:100;align-items:center;justify-content:center;}
.moverlay.active{display:flex;}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:26px;max-width:460px;width:90%;text-align:center;}
.modal h2{font-size:1rem;letter-spacing:.2em;margin-bottom:12px;color:var(--gold);}
.modal p{font-size:.86rem;line-height:1.6;color:var(--text);margin-bottom:7px;}
.droll{font-size:2.6rem;margin:13px 0;}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;}
.hpoverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:14px;}
.hpoverlay.active{display:flex;}
.hpname{font-family:'Orbitron',monospace;font-size:1.9rem;font-weight:900;}
.hpsub{color:var(--dim);letter-spacing:.3em;font-size:.8rem;}
.hpbtn{padding:12px 36px;border-radius:10px;font-family:'Orbitron',monospace;font-size:.82rem;letter-spacing:.2em;cursor:pointer;border:1px solid;transition:all .3s;text-transform:uppercase;}

/* ── END ── */
#end-screen{min-height:100vh;align-items:center;justify-content:center;padding:20px;}
.end-content{text-align:center;}
.wtitle{font-size:clamp(1.2rem,4vw,2.2rem);letter-spacing:.2em;margin-bottom:6px;color:var(--dim);}
.wname{font-size:clamp(2rem,7vw,4.5rem);font-weight:900;margin-bottom:24px;}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:440px;margin:0 auto 24px;}
.scard{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;}
.scard.winner{border-color:var(--gold);box-shadow:0 0 16px rgba(255,215,0,.18);}
.sval{font-size:2.6rem;font-family:'Orbitron',monospace;font-weight:900;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
/* Corner button panels */
.corner-panel{position:fixed;z-index:85;display:flex;gap:4px;padding:6px 10px;background:rgba(5,10,20,.8);border:1px solid var(--border);border-radius:8px;}
.corner-p1{top:70px;left:25%;transform:translateX(-50%);}
.corner-p2{top:70px;left:75%;transform:translateX(-50%);}
.corner-panel .abtn{padding:6px 10px;font-size:.55rem;}
/* ── ЖЕТОНЫ РЕСУРСОВ ── */
#left-panel{overflow-y:auto;}
/* ── ЖЕТОНЫ РЕСУРСОВ ── */
.tok-sup,.tok-dis,.tok-frg,.tok-jok{font-size:.84rem;font-family:'Orbitron',monospace;font-weight:700;padding:1px 3px;border-radius:3px;border:1px solid;line-height:1.3;pointer-events:none;}
.tok-sup{background:rgba(255,215,0,.25);color:#ffd700;border-color:rgba(255,215,0,.6);}
.tok-dis{background:rgba(0,200,255,.25);color:#00c8ff;border-color:rgba(0,200,255,.6);}
.tok-frg{background:rgba(255,140,0,.25);color:#ff8c00;border-color:rgba(255,140,0,.6);}
.tok-jok{background:rgba(180,0,255,.25);color:#c87aff;border-color:rgba(180,0,255,.6);}
/* доход: зелёный кружок; ценные: красный кружок */
.inc-mark{color:#4caf50;font-weight:700;text-shadow:0 1px 3px #000;}
.val-mark{color:#ff4444;font-weight:700;text-shadow:0 1px 3px #000;}
#tile-peek-popup{pointer-events:auto;cursor:pointer;transition:opacity .2s;}
.tile-peek-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:200px;height:200px;}
.tile-peek-cell.planet{background:rgba(0,120,40,.3);border:1px solid rgba(0,200,80,.4);}
.tile-peek-cell.space{background:rgba(0,30,80,.3);border:1px solid rgba(0,80,200,.3);}
.tile-peek-cell{border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;font-size:.72rem;}
/* ── FIRST PLAYER SELECTOR ── */
.fp-select{display:flex;align-items:center;gap:18px;padding:11px 20px;background:var(--panel);border:1px solid var(--border);border-radius:10px;width:100%;max-width:980px;justify-content:center;}
.fp-select > span{font-family:'Orbitron',monospace;font-size:.62rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;}
.fp-label{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:.88rem;padding:5px 14px;border-radius:7px;border:1px solid var(--border);transition:all .2s;color:var(--text);}
.fp-label:hover{border-color:var(--dim);}
.fp-label.fp-p1.active{border-color:var(--p1);background:rgba(0,200,255,.12);color:var(--p1);}
.fp-label.fp-p2.active{border-color:var(--p2);background:rgba(255,77,109,.12);color:var(--p2);}
/* ── WARP STORM ── */
.warp-storm{position:absolute;z-index:6;pointer-events:none;
  background-image:repeating-conic-gradient(rgba(10,10,10,.85) 0% 25%,rgba(210,210,210,.85) 0% 50%);
  background-size:8px 8px;}
.warp-storm-h{height:10px;left:0;right:0;}
.warp-storm-v{width:10px;top:0;bottom:0;}
.warp-storm-top{top:0;}.warp-storm-bottom{bottom:0;}

// Название юнита берётся из fac.unitNames['{ground|space}_{tier}'].
// Fallback: 'T{tier}' если фракция не определена или названия нет.
function getUnitName(factionId, unitType, tier) {
  const fac = FACTIONS.find(f => f.id === factionId);
  return (fac && fac.unitNames && fac.unitNames[`${unitType}_${tier}`]) || `T${tier}`;
}

const STRUCTURE_INFO = {
  factory: { icon:'⚙', label:'Фабрика' },
  city:    { icon:'⬡', label:'Город'   },
  bastion: { icon:'⛉', label:'Бастион' },
};

const TILES_PP = 3;
const CELL     = 320;

// TILE_CATALOG и функция tileDefToAreas загружены из tiles.js


// Tile rotation: RMAP[rot/90][originalIdx] = displayPosition
// Layout:  0|1
//          2|3
// 0°  → display order = original order
// 90° CW  → top-left gets original bottom-left, etc.
const RMAP = [
  [0,1,2,3],  // 0°
  [1,3,0,2],  // 90° CW  (TL→TR, TR→BR, BL→TL, BR→BL)
  [3,2,1,0],  // 180°
  [2,0,3,1],  // 270° CW (TL→BL, TR→TL, BL→BR, BR→TR)
];

// ══════════════════════════════════════════════
//  ROTATION HELPERS  (global functions, not inside setPhase)
// ══════════════════════════════════════════════
function getRotatedAreas(tile) {
  const rot = (tile.rotation || 0);
  const rmap = RMAP[rot / 90];
  const out = new Array(4);
  for (let i = 0; i < 4; i++) out[rmap[i]] = tile.areas[i];
  return out;
}

function getAreaByDisplay(tile, displayIdx) {
  return getRotatedAreas(tile)[displayIdx];
}

function getRealIdx(tile, displayIdx) {
  const area = getAreaByDisplay(tile, displayIdx);
  return tile.areas.indexOf(area);
}

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let nextId = 0;
let G;
let isSaving = false;  // флаг для предотвращения одновременных сохранений

// Адрес сервера API
const API_URL = 'http://localhost:8000';

const ORDER_TYPES = {
  dominate: { icon: '🎯', name: 'Dominate' },
  deploy: { icon: '🚀', name: 'Deploy' },
  advance: { icon: '⚔️', name: 'Advance' },
  strategize: { icon: '🧠', name: 'Strategize' },
};

function makeState() {
  return {
    version: 1,        // для миграции старых сохранений
    players: [
      { name:'Alpha', faction:null, color:'c1', pool:[], hand:[], structurePool:[], hand_orders:[] },
      { name:'Omega', faction:null, color:'c2', pool:[], hand:[], structurePool:[], hand_orders:[] },
    ],
    phase: 'setup',
    curP: 0,           // текущий игрок в этом раунде (кто сейчас ходит)
    round: 1, totalRounds: 8,
    firstPlayer: 0,    // кто ходит первым в этом раунде (не меняется в раунде)
    map: {},           // "col,row" → tile obj
    tilesPlaced: 0,
    lastKey: null,
    // ── undo state ──────────────────────────
    tileSnap: null,        // { handIdx, key } — set by dropTile, cleared by undoTile or endTurn
    unitsPlaced: [],       // [{ key, realAreaIdx, unitId }]
    structsPlaced: [],     // [{ key, realAreaIdx, structId }]
    // ── turn snapshot (for undo to start of turn) ───
    _turnSnap: null,       // deep snapshot at start of each player's turn
    // ── selection ──────────────────────────
    selHandIdx: null,
    selUnitIdx: null,
    selUnitType: null,
    selStructIdx: null,    // index in cp.structurePool
    // ── warp storms ──────────────────────────
    warpStorms: [],    // [{ tileKey: 'col,row', side: 'top'|'bottom'|'left'|'right', owner: 0|1 }]
    warpStormStep: 0,  // 0 = second player places, 1 = first player places
    warpConfirmed: [false, false],  // подтверждение варп-штормов каждым игроком
    // ── target markers ──────────────────────
    targetMarkers: [], // [{ tile: 'col,row', areaIdx: int, owner: 0|1 }]
    // ── orders (управляются Python Stage 2) ──
    orders: [],        // [{ id, type, owner, tile, position, revealed }]
    ordersPlaced: [0, 0],
  };
}

// ══════════════════════════════════════════════
//  COLOR HELPERS
// ══════════════════════════════════════════════
// Возвращает '#ffffff' или '#000000' в зависимости от яркости фона
function getTextColor(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  return lum > 0.35 ? '#000000' : '#ffffff';
}
// hex + alpha → rgba(...)
function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ══════════════════════════════════════════════
//  SAVE / LOAD
// ══════════════════════════════════════════════
const SAVE_KEY = 'stellar_conflict_map';

function saveGame() {
  if (isSaving) {
    console.warn('Сохранение уже в процессе, игнорируем дублирующийся запрос');
    return;
  }

  isSaving = true;
  const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, -5);
  const filename = `game_${timestamp}`;

  fetch(`${API_URL}/api/save`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ filename, state: G })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      console.log(`✅ Игра сохранена: ${data.filename}`);
      showMsg('💾 Сохранено', `Игра сохранена в файл:<br><strong>${data.filename}</strong><br><br>📁 Папка: Загрузки/Stellar_Conflict_Saves/`);
    } else {
      console.error('Ошибка сохранения на сервере:', data.error);
      showMsg('Ошибка сохранения', data.error || 'Неизвестная ошибка');
    }
  })
  .catch(e => {
    console.error('Сервер недоступен, используем localStorage:', e);
    // Fallback на localStorage если сервер недоступен
    localStorage.setItem('game_' + filename, JSON.stringify(G));
    showMsg('💾 Сохранено (локально)', `Игра сохранена в браузер.<br><strong>${filename}</strong><br><br>⚠ Сервер недоступен.<br>Для сохранения в Загрузки запустите:<br><code>python game_server.py</code>`);
  })
  .finally(() => {
    isSaving = false;
  });
}

function loadGame() {
  fetch(`${API_URL}/api/list`)
  .then(r => r.json())
  .then(data => {
    if (!data.success || data.games.length === 0) {
      console.warn('⚠️  Нет сохранённых игр на сервере');
      showMsg('Нет сохранений', 'Сохранённые игры находятся в:<br>Загрузки/Stellar_Conflict_Saves/<br><br>Запустите сервер: python game_server.py');
      return;
    }

    let html = '<div style="max-height:500px;overflow-y:auto;">';
    data.games.forEach(g => {
      const date = new Date(g.modified * 1000).toLocaleString();
      html += `<div style="padding:8px;background:rgba(0,200,255,.1);margin-bottom:6px;border-radius:4px;cursor:pointer;" onclick="loadGameFile('${g.filename}')">
        <div style="font-weight:bold;">${g.filename}</div>
        <div style="font-size:.75rem;color:#aaa;">${date} · ${g.size} B</div>
      </div>`;
    });
    html += '</div>';

    console.log(`✅ Получено ${data.games.length} сохранённых игр`);
    showMsg('📂 Загрузить игру', html);
  })
  .catch(e => {
    console.error('❌ Ошибка при загрузке списка игр:', e);
    showMsg('Ошибка', '⚠ Сервер недоступен.<br><br>Для загрузки из Загрузок запустите:<br><code>python game_server.py</code>');
  });
}

function validateGameState(state) {
  // Проверка обязательных полей
  const requiredFields = ['version', 'players', 'phase', 'map', 'curP'];
  for (const field of requiredFields) {
    if (!(field in state)) {
      return { valid: false, error: `Отсутствует поле: ${field}` };
    }
  }

  // Проверка версии
  if (state.version !== 1) {
    console.warn(`⚠️  Версия сохранения: ${state.version}. Текущая версия: 1. Попытаемся загрузить...`);
  }

  // Проверка типов
  if (!Array.isArray(state.players) || state.players.length !== 2) {
    return { valid: false, error: 'Некорректное количество игроков' };
  }

  if (typeof state.phase !== 'string') {
    return { valid: false, error: 'Некорректная фаза игры' };
  }

  return { valid: true };
}

function loadGameFile(filename) {
  fetch(`${API_URL}/api/load/${filename}`)
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      const validation = validateGameState(data.state);
      if (!validation.valid) {
        console.error('❌ Ошибка валидации:', validation.error);
        showMsg('Ошибка загрузки', `Файл повреждён или устарел:<br><strong>${validation.error}</strong>`);
        return;
      }

      Object.keys(G).forEach(k => delete G[k]);
      Object.assign(G, data.state);
      console.log(`✅ Игра загружена: ${filename}`);
      showScreen('game-screen');

      // Если это Stage 2 (order-placement или позже) — инициализируем сервер
      if (G.phase === 'order-placement' || G.phase === 'game-start') {
        console.log('🔄 Инициализирую Stage 2 для загруженной игры...');
        _orderPlacedThisTurn = false;  // Сбросить флаг при загрузке
        startStage2();
      } else {
        setPhase(G.phase);
        updateHeader();
        renderBoard();
        renderSide();
      }

      addLog('Игра загружена', -1);
      closeMsgModal();
    } else {
      console.error('❌ Ошибка загрузки файла:', data.error);
      showMsg('Ошибка загрузки', data.error);
    }
  })
  .catch(e => {
    console.error('❌ Ошибка при загрузке:', e);
    showMsg('Ошибка', 'Не удалось загрузить: ' + e.message);
  });
}

/** HTML строка с начальными ресурсами фракции для кнопки выбора */
function _facResHtml(f) {
  const parts = [];
  if (f.credits)  parts.push(`💰${f.credits}`);
  if (f.tokens?.reinforcement) parts.push(`>${f.tokens.reinforcement}`);
  if (f.tokens?.cash)          parts.push(`$${f.tokens.cash}`);
  if (f.tokens?.forge)         parts.push(`T${f.tokens.forge}`);
  if (f.structures?.length) {
    const counts = {};
    f.structures.forEach(s => { counts[s] = (counts[s] || 0) + 1; });
    Object.entries(counts).forEach(([s, n]) => {
      const info = STRUCTURE_INFO[s] || { icon:'?' };
      parts.push(`${info.icon}${n > 1 ? n : ''}`);
    });
  }
  if (!parts.length) return '';
  return parts.map(p => `<span style="background:rgba(255,255,255,.06);padding:1px 4px;border-radius:3px;">${p}</span>`).join('');
}

function buildFactionUI() {
  [0,1].forEach(pi => {
    const cont = document.getElementById(`p${pi+1}-factions`);
    cont.innerHTML = '';
    FACTIONS.forEach(f => {
      const btn = document.createElement('div');
      btn.className = 'faction-btn';
      btn.dataset.fid = f.id;
      const resHtml = _facResHtml(f);
      btn.innerHTML = `<span class="fi">${f.icon}</span><div class="fn">${f.name}</div><div class="ff">${f.flavor}</div><div class="fres">${resHtml}</div>`;
      btn.onclick = () => pickFaction(pi, f.id);
      cont.appendChild(btn);
    });
  });
  G.players[0].faction = 'chaos';
  G.players[1].faction = 'marine';
  refreshFactionUI();
}

function pickFaction(pi, fid) {
  if (G.players[1-pi].faction === fid) return;
  G.players[pi].faction = fid;
  refreshFactionUI();
}

function refreshFactionUI() {
  [0,1].forEach(pi => {
    const other = G.players[1-pi].faction;
    document.querySelectorAll(`#p${pi+1}-factions .faction-btn`).forEach(btn => {
      btn.classList.remove('sel1','sel2','taken');
      const fac = FACTIONS.find(f => f.id === btn.dataset.fid);
      const col = fac?.color || '#888888';

      if (btn.dataset.fid === G.players[pi].faction) {
        // Выбрана: полный цвет фракции, текст инвертируется при необходимости
        btn.style.background   = col;
        btn.style.borderColor  = col;
        btn.style.color        = getTextColor(col);
        btn.classList.add(pi===0?'sel1':'sel2');
      } else if (btn.dataset.fid === other) {
        // Занята другим игроком: приглушённый цвет
        btn.style.background   = hexAlpha(col, 0.08);
        btn.style.borderColor  = hexAlpha(col, 0.25);
        btn.style.color        = '';
        btn.classList.add('taken');
      } else {
        // Обычное состояние: мягкий цветной фон + цветная рамка
        btn.style.background   = hexAlpha(col, 0.13);
        btn.style.borderColor  = hexAlpha(col, 0.55);
        btn.style.color        = col;
      }
    });
  });
}

function pickFirstPlayer(pi) {
  document.getElementById('fp-lbl-0').classList.toggle('active', pi === 0);
  document.getElementById('fp-lbl-1').classList.toggle('active', pi === 1);
  document.querySelector(`input[name="first-player"][value="${pi}"]`).checked = true;
}

function startGame() {
  if (!G.players[0].faction || !G.players[1].faction) { showMsg('Выберите фракции','Оба игрока должны выбрать фракцию.'); return; }
  G.players[0].name = document.getElementById('p1-name').value.trim() || 'Alpha';
  G.players[1].name = document.getElementById('p2-name').value.trim() || 'Omega';

  // Первый игрок
  const fpVal = parseInt(document.querySelector('input[name="first-player"]:checked')?.value ?? '0');
  G.firstPlayer = fpVal;
  G.curP = fpVal;

  // Применяем цвета выбранных фракций как CSS-переменные игроков
  const f1 = FACTIONS.find(f => f.id === G.players[0].faction);
  const f2 = FACTIONS.find(f => f.id === G.players[1].faction);
  document.documentElement.style.setProperty('--p1', f1?.color || '#00c8ff');
  document.documentElement.style.setProperty('--p2', f2?.color || '#ff4d6d');

  // Раздаём тайлы из каталога: каждому игроку 1 домашний (свой для фракции) + (TILES_PP-1) обычных
  const normalTiles = [...TILE_CATALOG.filter(t => !t.isHome)].sort(() => Math.random()-.5);

  G.players.forEach((p, pi) => {
    const fac = FACTIONS.find(f => f.id === p.faction);
    p.pool = [];
    // Добавляем юниты с правильными уровнями из unitTiers
    if (fac.unitTiers?.ground && Array.isArray(fac.unitTiers.ground)) {
      fac.unitTiers.ground.forEach(tier => p.pool.push({ id:nextId++, player:pi, unitType:'ground', tier }));
    }
    if (fac.unitTiers?.space && Array.isArray(fac.unitTiers.space)) {
      fac.unitTiers.space.forEach(tier => p.pool.push({ id:nextId++, player:pi, unitType:'space', tier }));
    }
    // Добавляем структуры (фабрики из structures массива)
    p.structurePool = [];
    if (Array.isArray(fac.structures)) {
      fac.structures.forEach(type => p.structurePool.push({ id:nextId++, player:pi, type }));
    }
    p.credits = fac.credits ?? 6;
    p.tokens  = { ...(fac.tokens ?? {reinforcement:0,cash:0,forge:0}) };

    // Инициализируем поля карт (будут заполнены сервером при Stage 2)
    p.hand_battle_cards = [];
    p.available_battle_cards = [];
    p.hand_order_upgrades = [];
    p.available_order_upgrades = [];
    p.hand_event_cards = [];
    p.available_event_cards = [];
    p.boughtUpgrades = [];

    // Инициализируем приказы (2 dominate, 2 deploy, 2 advance, 2 strategize)
    p.hand_orders = [
      { id:`p${pi+1}_dominate_1`, type:'dominate', owner:pi },
      { id:`p${pi+1}_dominate_2`, type:'dominate', owner:pi },
      { id:`p${pi+1}_deploy_1`, type:'deploy', owner:pi },
      { id:`p${pi+1}_deploy_2`, type:'deploy', owner:pi },
      { id:`p${pi+1}_advance_1`, type:'advance', owner:pi },
      { id:`p${pi+1}_advance_2`, type:'advance', owner:pi },
      { id:`p${pi+1}_strategize_1`, type:'strategize', owner:pi },
      { id:`p${pi+1}_strategize_2`, type:'strategize', owner:pi },
    ];
    const myHome = TILE_CATALOG.find(t => t.id === fac.homeTileId)
                || TILE_CATALOG.find(t => t.isHome);
    const myNormal = normalTiles.splice(0, TILES_PP - 1);
    p.hand = [myHome, ...myNormal].map((td, t) => ({
      handIdx:   t,
      tileDefId: td.id,
      tileId:    nextId++,
      isHome:    td.isHome,
      placed:    false,
    }));
  });

  // G.firstPlayer и G.curP уже заданы выше
  showScreen('game-screen');
  updateHeader();
  renderBoard();
  showHP(G.players[G.firstPlayer].name, 'Разместите вашу первую систему', () => setPhase('tile-placement'));
}

// ══════════════════════════════════════════════
//  PHASE  — only sets UI state, never touches tileSnap/unitsPlaced
// ══════════════════════════════════════════════
function setPhase(phase) {
  G.phase = phase;
  G.selHandIdx = null;
  G.selUnitIdx = null;
  G.selUnitType = null;

  // Hide all action buttons
  ['btn-ut','btn-fl','btn-rccw','btn-rcw','btn-et','btn-pass','btn-undo-order','btn-undo-ws','btn-confirm-ws'].forEach(id => {
    document.getElementById(id).style.display = 'none';
  });

  const cp  = G.players[G.curP];
  const ins = document.getElementById('pinstr');

  if (phase === 'tile-placement') {
    G.tileSnap   = null;
    G.unitsPlaced = [];
    const rem = cp.hand.filter(h => !h.placed).length;
    ins.innerHTML = `<strong>РАЗМЕЩЕНИЕ СИСТЕМ</strong><br>${cp.name}: выберите систему из руки, затем кликните ячейку. Осталось: ${rem}`;
    renderSide(); renderBoard();
  }
  else if (phase === 'troop-on-tile') {
    // tileSnap + unitsPlaced уже заданы в dropTile — НЕ сбрасывать
    const tile = G.map[G.lastKey];
    const needObj = tile?.needsObjective && !tile?.objectiveMarker;
    const objHint = needObj ? `<br><small style="color:var(--gold)">★ Кликните область без выбранного войска чтобы поставить метку цели соперника</small>` : '';
    ins.innerHTML = `<strong>ВОЙСКА НА СИСТЕМУ</strong><br>${cp.name}: размещайте войска на только что поставленной системе.<br><small style="color:var(--dim)">▲ наземные → 🪐 · ◈ космические → ✦</small>${objHint}`;
    show('btn-ut'); show('btn-uu'); show('btn-fl'); show('btn-rccw'); show('btn-rcw'); show('btn-et');
    document.getElementById('btn-et').textContent = 'Готово →';
    renderSide(); renderBoard(G.lastKey);
  }
  else if (phase === 'warp-storm') {
    const myStorm = G.warpStorms.find(ws => ws.owner === G.curP);
    if (myStorm && !G.warpConfirmed[G.curP]) {
      ins.innerHTML = `<strong>ВАРП-ШТОРМ</strong><br>${cp.name}: варп-шторм размещён на [${myStorm.tileKey}] ${myStorm.side}. Подтвердите или отмените.`;
      show('btn-undo-ws');
      show('btn-confirm-ws');
    } else if (G.warpConfirmed[G.curP]) {
      ins.innerHTML = `<strong>ВАРП-ШТОРМ</strong><br>${cp.name}: размещение подтверждено. Ожидание второго игрока...`;
    } else {
      ins.innerHTML = `<strong>ВАРП-ШТОРМ</strong><br>${cp.name}: кликните на границу любой системы чтобы поставить варп-шторм`;
    }
    renderBoard();
  }
  else if (phase === 'order-placement') {
    ins.innerHTML = `<strong>РАССТАНОВКА ПРИКАЗОВ</strong><br>${cp.name}: выберите приказ, кликните центр системы. Выставлено: ${G.ordersPlaced[G.curP]}/4`;
    show('btn-pass');
    if (_orderPlacedThisTurn) {
      show('btn-undo-order');
    }
    renderSide(); renderBoard();
  }
  updateHeader();
}

function selectHandTile(idx) {
  if (G.phase !== 'tile-placement') return;
  if (G.players[G.curP].hand[idx].placed) return;
  G.selHandIdx = idx;
  _cancelTileHover(); _cancelTileHideTimer(); _dismissTilePreview();
  renderSide(); renderBoard();
}

function getValidDrops() {
  const placed = Object.values(G.map);
  if (!placed.length) return [{col:0,row:0}];
  const cands = new Set();
  placed.forEach(({col,row}) => {
    [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dc,dr]) => {
      const k = `${col+dc},${row+dr}`;
      if (!G.map[k]) cands.add(k);
    });
  });
  const valid = [];
  cands.forEach(k => {
    const [nc,nr] = k.split(',').map(Number);
    const cols = placed.map(t=>t.col).concat([nc]);
    const rows = placed.map(t=>t.row).concat([nr]);
    const w = Math.max(...cols)-Math.min(...cols)+1;
    const h = Math.max(...rows)-Math.min(...rows)+1;
    if ((w<=3&&h<=2)||(w<=2&&h<=3)) valid.push({col:nc,row:nr});
  });
  return valid;
}

function dropTile(col, row) {
  if (G.selHandIdx === null) { showMsg('Выберите систему','Сначала выберите систему из руки.'); return; }
  const cp = G.players[G.curP];
  const ht = cp.hand[G.selHandIdx];
  if (!ht || ht.placed) return;

  const key = `${col},${row}`;
  const tileDef  = TILE_CATALOG.find(t => t.id === ht.tileDefId) || TILE_CATALOG[0];
  const sideData = tileDef.sides[0];

  ht.placed = true;
  G.tilesPlaced++;

  // Build tile object — areas with capacity, income, tokens, troops
  G.map[key] = {
    key, col, row,
    owner:     G.curP,
    isHome:    ht.isHome,
    tileId:    ht.tileId,
    tileDefId: ht.tileDefId,
    rotation:  0,
    side:      0,
    areas:     tileDefToAreas(sideData).map(a => ({ ...a, structures:[] })),
    needsObjective: Object.values(G.map).filter(t => t.owner === G.curP).length < 2,  // первые два тайла игрока получают метку цели
    objectiveMarker: null,               // { owner: playerIdx, realAreaIdx: N }
  };
  G.lastKey     = key;

  // Set undo snapshot BEFORE calling setPhase
  G.tileSnap      = { handIdx: G.selHandIdx, key };
  G.unitsPlaced   = [];
  G.structsPlaced = [];
  G.selHandIdx  = null;

  addLog(`${cp.name} разместил${ht.isHome?' домашнюю':''} систему [${key}]`, G.curP);

  _afterTilePlaced();
}

// ══════════════════════════════════════════════
//  UNDO TILE  — fully self-contained, no setPhase call for cleanup
// ══════════════════════════════════════════════
function undoTile() {
  if (G.phase !== 'tile-placement' && G.phase !== 'troop-on-tile') return;
  if (!G.tileSnap) { showMsg('Нечего отменять','Нет активного тайла для возврата.'); return; }

  const cp   = G.players[G.curP];
  const snap = G.tileSnap;  // local copy before we clear state

  // 1. Return all units placed this turn to pool
  for (const rec of G.unitsPlaced) {
    const tile = G.map[rec.key];
    if (!tile) continue;
    const area = tile.areas[rec.realAreaIdx];
    if (!area) continue;
    const idx = area.troops.findIndex(t => t.id === rec.unitId);
    if (idx >= 0) { cp.pool.push(area.troops.splice(idx, 1)[0]); }
  }
  // Return all structures placed this turn to pool
  for (const rec of G.structsPlaced) {
    const tile = G.map[rec.key];
    if (!tile) continue;
    const area = tile.areas[rec.realAreaIdx];
    if (!area) continue;
    if (!area.structures) area.structures = [];
    const idx = area.structures.findIndex(s => s.id === rec.structId);
    if (idx >= 0) { cp.structurePool.push(area.structures.splice(idx, 1)[0]); }
  }

  // 2. Remove tile from map, restore to hand
  delete G.map[snap.key];
  cp.hand[snap.handIdx].placed = false;
  G.tilesPlaced--;

  // 3. Clear undo state
  G.tileSnap      = null;
  G.unitsPlaced   = [];
  G.structsPlaced = [];
  G.lastKey     = null;

  addLog(`${cp.name} вернул систему [${snap.key}] в руку`, G.curP);

  // 4. Go back to tile-placement (this WILL clear snap/unitsPlaced again — harmless)
  setPhase('tile-placement');
}

// ══════════════════════════════════════════════
//  TILE ROTATION
// ══════════════════════════════════════════════
function rotateTile(cw) {
  if (!G.lastKey) return;
  const tile = G.map[G.lastKey];
  if (!tile) return;
  tile.rotation = cw ? (tile.rotation + 90) % 360 : (tile.rotation + 270) % 360;
  addLog(`Поворот [${tile.key}] ${cw?'по ч.':'пр. ч.'} → ${tile.rotation}°`, G.curP);
  renderBoard();
}

function flipTile() {
  if (!G.lastKey) return;
  const tile = G.map[G.lastKey];
  if (!tile) return;
  if (G.unitsPlaced.length > 0 || G.structsPlaced.length > 0) {
    showMsg('Нельзя перевернуть', 'Сначала верните все размещённые войска и постройки.');
    return;
  }
  const tileDef = TILE_CATALOG.find(t => t.id === tile.tileDefId);
  if (!tileDef || tileDef.sides.length < 2) {
    showMsg('Нельзя перевернуть', 'У этого тайла нет оборотной стороны.');
    return;
  }
  tile.side = 1 - (tile.side || 0);
  const sideData = tileDef.sides[tile.side];
  tile.areas    = tileDefToAreas(sideData).map(a => ({...a, structures: []}));
  tile.rotation = 0;
  tile.objectiveMarker = null; // сбрасываем метку при перевороте (areas полностью пересоздаются)
  G.selStructIdx = null; G.selUnitIdx = null; G.selUnitType = null;
  addLog(`${G.players[G.curP].name} перевернул тайл [${tile.key}] → сторона ${tile.side===0?'A':'B'}`, G.curP);
  renderBoard();
  renderSide();
}

// ── СОХРАНЕНИЕ КАРТЫ ─────────────────────────────────────────────────────────
function exportMap() {
  const mapData = {
    saved_at:     new Date().toISOString(),
    round:        G.round,
    total_rounds: G.totalRounds,
    players:      G.players.map((p,pi) => ({
      id: pi, name: p.name, faction: p.faction,
    })),
    tiles: Object.values(G.map).map(tile => ({
      key:       tile.key,
      col:       tile.col,
      row:       tile.row,
      tileDefId: tile.tileDefId,
      isHome:    tile.isHome,
      owner:     tile.owner,
      rotation:  tile.rotation,
      side:      tile.side || 0,
      areas:     tile.areas.map((a, ai) => ({
        index:    ai,
        type:     a.type,
        capacity: a.capacity,
        income:   a.income,
        valuable: a.valuable,
        reinforcement:  a.support,
        cash:           a.discount,
        forge:    a.forge,
        joker:    a.joker,
        troops:   a.troops.map(u => ({ player:u.player, unitType:u.unitType })),
      })),
    })),
  };
  const blob = new Blob([JSON.stringify(mapData, null, 2)], { type:'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `stellar_conflict_map_${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  addLog('Карта сохранена в файл.', -1);
}

// ══════════════════════════════════════════════
//  AFTER TILE PLACED
// ══════════════════════════════════════════════
function _afterTilePlaced() {
  // Always go to troop-on-tile first — endTurn() handles the next step
  setPhase('troop-on-tile');
}

// ══════════════════════════════════════════════
//  AREA CLICK (stub — no unit placement)
// ══════════════════════════════════════════════
function areaClick(key, displayIdx) {
  if (G.phase !== 'troop-on-tile') return;
  if (key !== G.lastKey) { showMsg('Другой тайл', 'Размещайте войска только на только что поставленной системе.'); return; }

  const cp = G.players[G.curP];
  const tile = G.map[key];
  if (!tile) return;
  const area = getAreaByDisplay(tile, displayIdx);
  const realIdx = tile.areas.indexOf(area);

  // Разместить / переместить метку цели (если ничего не выбрано)
  if (tile.needsObjective && G.selUnitIdx === null && G.selStructIdx === null) {
    const eligibleIdxs = getObjectiveEligibleDisplayIdxs(tile);
    if (eligibleIdxs.includes(displayIdx)) {
      if (area.type !== 'planet') return; // только планеты
      tile.objectiveMarker = { owner: 1 - G.curP, realAreaIdx: realIdx };
      addLog(`${cp.name} разместил метку цели на [${key}] зона ${displayIdx+1}`, G.curP);
      setPhase('troop-on-tile'); // обновить подсказку
      return;
    }
  }

  // Разместить постройку
  if (G.selStructIdx !== null) {
    const struct = cp.structurePool[G.selStructIdx];
    if (!struct) return;
    if (area.type !== 'planet') { showMsg('Только планеты', 'Постройки размещаются только на планетах (🪐).'); return; }
    if (!area.structures) area.structures = [];
    if (area.structures.length > 0) { showMsg('Занято', 'На этой планете уже есть постройка.'); return; }
    area.structures.push(struct);
    cp.structurePool.splice(G.selStructIdx, 1);
    G.structsPlaced.push({ key, realAreaIdx: realIdx, structId: struct.id, _seq: nextId++ });
    const info = STRUCTURE_INFO[struct.type] || { icon:'?', label:struct.type };
    addLog(`${cp.name} → [${key}] зона ${displayIdx+1} (${info.icon} ${info.label})`, G.curP);
    G.selStructIdx = null;
    renderSide(); renderBoard(G.lastKey);
    return;
  }

  // Разместить юнита
  if (G.selUnitIdx === null) return;
  const unit = cp.pool[G.selUnitIdx];
  if (!unit) return;
  if (!isCompatible(unit, area.type)) {
    showMsg('Несовместимо', unit.unitType === 'ground' ? 'Наземные войска — только на планеты 🪐.' : 'Космические войска — только в космос ✦.');
    return;
  }
  if (area.troops.length >= area.capacity) { showMsg('Переполнено', `Максимальная вместимость: ${area.capacity}.`); return; }
  area.troops.push(unit);
  cp.pool.splice(G.selUnitIdx, 1);
  G.unitsPlaced.push({ key, realAreaIdx: realIdx, unitId: unit.id, _seq: nextId++ });
  addLog(`${cp.name} → [${key}] зона ${displayIdx+1} (${unit.unitType === 'ground' ? '▲' : '◈'} T${unit.tier ?? 0})`, G.curP);
  G.selUnitIdx = null; G.selUnitType = null;
  renderSide(); renderBoard(G.lastKey);
}

// ══════════════════════════════════════════════
//  TURN TRANSITIONS
// ══════════════════════════════════════════════
function endTurn() {
  if (G.phase !== 'troop-on-tile') return;
  const cp = G.players[G.curP];

  // На последнем тайле — обязательно разместить все войска, которые туда помещаются
  const myTilesPlaced = Object.values(G.map).filter(t => t.owner === G.curP).length;
  if (myTilesPlaced >= TILES_PP && cp.pool.length > 0) {
    const tile = G.map[G.lastKey];
    const canPlace = tile && cp.pool.some(u =>
      getRotatedAreas(tile).some(a => isCompatible(u, a.type) && a.troops.length < a.capacity)
    );
    if (canPlace) {
      showMsg('Разместите войска', 'Это ваш последний тайл — разместите все войска, которые сюда помещаются.');
      return;
    }
  }

  // Метка цели обязательна на первых двух тайлах
  const tileForObj = G.map[G.lastKey];
  if (tileForObj?.needsObjective && !tileForObj.objectiveMarker) {
    showMsg('Разместите метку цели', 'Поставьте метку цели соперника — кликните на область тайла без выбранного войска.');
    return;
  }

  G.tileSnap = null; G.unitsPlaced = []; G.structsPlaced = [];
  G.selUnitIdx = null; G.selUnitType = null; G.selStructIdx = null;

  if (G.tilesPlaced < TILES_PP * 2) {
    G.curP = 1 - G.curP;
    showHP(G.players[G.curP].name, 'Разместите систему', () => setPhase('tile-placement'));
  } else {
    startWarpStormPlacement();
  }
}

// ORDER PLACEMENT — логика перенесена в Python (Stage 2)
// Функции apiCall / applyState / startStage2 находятся ниже перед INIT

// ══════════════════════════════════════════════
//  UNIT PLACEMENT
// ══════════════════════════════════════════════
function selectUnitFromPool(idx) {
  if (G.phase !== 'troop-on-tile') return;
  G.selUnitIdx  = idx;
  G.selUnitType = G.players[G.curP].pool[idx]?.unitType || null;
  G.selStructIdx = null;
  renderSide(); renderBoard(G.lastKey);
}

function selectStructFromPool(idx) {
  if (G.phase !== 'troop-on-tile') return;
  G.selStructIdx = idx;
  G.selUnitIdx   = null;
  G.selUnitType  = null;
  renderSide(); renderBoard(G.lastKey);
}

function undoLastUnit() {
  if (G.phase !== 'troop-on-tile') return;
  const cp = G.players[G.curP];
  const lastUnitSeq   = G.unitsPlaced.length  > 0 ? (G.unitsPlaced[G.unitsPlaced.length-1]._seq   ?? -1) : -1;
  const lastStructSeq = G.structsPlaced.length > 0 ? (G.structsPlaced[G.structsPlaced.length-1]._seq ?? -1) : -1;

  if (G.structsPlaced.length > 0 && lastStructSeq > lastUnitSeq) {
    const rec  = G.structsPlaced.pop();
    const tile = G.map[rec.key];
    if (tile) {
      const area = tile.areas[rec.realAreaIdx];
      if (!area.structures) area.structures = [];
      const idx = area.structures.findIndex(s => s.id === rec.structId);
      if (idx >= 0) {
        const s = area.structures.splice(idx, 1)[0];
        cp.structurePool.push(s);
        const info = STRUCTURE_INFO[s.type] || { icon:'?', label:s.type };
        addLog(`${cp.name} вернул ${info.icon}${info.label}`, G.curP);
      }
    }
  } else if (G.unitsPlaced.length > 0) {
    const rec  = G.unitsPlaced.pop();
    const tile = G.map[rec.key];
    if (tile) {
      const area = tile.areas[rec.realAreaIdx];
      const idx  = area.troops.findIndex(t => t.id === rec.unitId);
      if (idx >= 0) {
        cp.pool.push(area.troops.splice(idx, 1)[0]);
        addLog(`${cp.name} вернул юнита`, G.curP);
      }
    }
  } else {
    showMsg('Нечего отменять', 'Нет размещённых войск для возврата.');
    return;
  }
  G.selUnitIdx = null; G.selUnitType = null; G.selStructIdx = null;
  renderSide(); renderBoard(G.lastKey);
}

// ══════════════════════════════════════════════
//  ISCOMPATIBLE (kept for undoTile internal use)
// ══════════════════════════════════════════════
function isCompatible(unit, areaType) {
  return (unit.unitType==='ground' && areaType==='planet') ||
         (unit.unitType==='space'  && areaType==='space');
}

// ══════════════════════════════════════════════
//  OBJECTIVE MARKER HELPERS
// ══════════════════════════════════════════════
// Возвращает displayIdx областей тайла, на которые можно ставить метку цели.
// Нормальный тайл (2 планеты): обе планеты.
// Домашний тайл (3 планеты + 1 космос): планеты, соседствующие с космосом по горизонтали/вертикали.
function getObjectiveEligibleDisplayIdxs(tile) {
  const areas = getRotatedAreas(tile);
  const planetIdxs = areas.map((a,i) => ({a,i})).filter(x => x.a.type === 'planet').map(x => x.i);
  if (planetIdxs.length <= 2) return planetIdxs;
  // 3 планеты + 1 космос: исключить планету, диагональную к космосу
  const spaceIdx = areas.findIndex(a => a.type === 'space');
  const diagonal = { 0:3, 1:2, 2:1, 3:0 };
  const diagOfSpace = diagonal[spaceIdx];
  return planetIdxs.filter(i => i !== diagOfSpace);
}

// ══════════════════════════════════════════════
//  WARP STORM PLACEMENT
// ══════════════════════════════════════════════
function startWarpStormPlacement() {
  G.warpStorms = [];
  G.warpStormStep = 0;
  G.warpConfirmed = [false, false];
  // Второй игрок (не первый) ставит варп-шторм первым
  G.curP = 1 - G.firstPlayer;
  renderBoard(); updateHeader();
  showHP(G.players[G.curP].name, 'Разместите варп-шторм', () => setPhase('warp-storm'));
}

function placeWarpStorm(tileKey, side) {
  if (G.phase !== 'warp-storm') return;
  // Нельзя ставить туда, где уже стоит варп-шторм
  if (G.warpStorms.some(ws => ws.tileKey === tileKey && ws.side === side)) return;
  // Нельзя ставить если уже разместил свой
  if (G.warpStorms.some(ws => ws.owner === G.curP)) return;
  // Нельзя ставить если уже подтвердил
  if (G.warpConfirmed[G.curP]) return;

  G.warpStorms.push({ tileKey, side, owner: G.curP });
  addLog(`${G.players[G.curP].name} поставил варп-шторм: [${tileKey}] ${side}`, G.curP);
  setPhase('warp-storm');
}

function undoWarpStorm() {
  if (G.phase !== 'warp-storm') return;
  const idx = G.warpStorms.findIndex(ws => ws.owner === G.curP);
  if (idx === -1) return;
  G.warpStorms.splice(idx, 1);
  G.warpConfirmed[G.curP] = false;
  addLog(`${G.players[G.curP].name} отменил варп-шторм`, G.curP);
  setPhase('warp-storm');
}

function confirmWarpStorm() {
  if (G.phase !== 'warp-storm') return;
  if (!G.warpStorms.some(ws => ws.owner === G.curP)) return;
  G.warpConfirmed[G.curP] = true;
  addLog(`${G.players[G.curP].name} подтвердил варп-шторм`, G.curP);

  // Проверяем: оба подтвердили?
  if (G.warpConfirmed[0] && G.warpConfirmed[1]) {
    // Оба подтвердили — переход к приказам
    addLog('Варп-штормы установлены. Начинается расстановка приказов.', -1);
    G.curP = G.firstPlayer;
    G.ordersPlaced = [0, 0];
    G.orders = [];
    renderBoard(); updateHeader();
    startStage2();
  } else {
    // Передаём ход второму игроку
    G.curP = 1 - G.curP;
    updateHeader();
    const myStorm = G.warpStorms.find(ws => ws.owner === G.curP);
    if (myStorm && G.warpConfirmed[G.curP]) {
      // Второй уже подтвердил (не должно случиться, но на всякий)
    } else if (myStorm) {
      // Уже разместил, но не подтвердил
      showHP(G.players[G.curP].name, 'Подтвердите варп-шторм', () => setPhase('warp-storm'));
    } else {
      // Ещё не разместил
      showHP(G.players[G.curP].name, 'Разместите варп-шторм', () => setPhase('warp-storm'));
    }
  }
}

// ══════════════════════════════════════════════
//  STUBS (not used but kept for safety)
// ══════════════════════════════════════════════

// ══════════════════════════════════════════════
//  RENDER BOARD
// ══════════════════════════════════════════════
function renderBoard() {
  const board = document.getElementById('map-board');
  board.innerHTML = '';
  const tiles = Object.values(G.map);

  const cols = tiles.map(t=>t.col);
  const rows = tiles.map(t=>t.row);
  const minC=(cols.length?Math.min(...cols):0)-1;
  const minR=(rows.length?Math.min(...rows):0)-1;
  const maxC=(cols.length?Math.max(...cols):2)+1;
  const maxR=(rows.length?Math.max(...rows):1)+1;
  const W=(maxC-minC+1)*CELL, H=(maxR-minR+1)*CELL;
  board.style.width=W+'px'; board.style.height=H+'px';

  const px = (col,row) => ({left:(col-minC)*CELL, top:(row-minR)*CELL});

  // Drop cells (tile-placement phase)
  if (G.phase==='tile-placement' && G.selHandIdx!==null) {
    getValidDrops().forEach(({col,row}) => {
      const p=px(col,row);
      const el=document.createElement('div');
      el.className='drop-cell';
      el.style.cssText=`left:${p.left}px;top:${p.top}px;width:${CELL}px;height:${CELL}px;`;
      el.innerHTML='<span style="font-size:1.4rem;color:rgba(0,200,255,.5);font-family:Orbitron">+</span>';
      el.onclick=()=>dropTile(col,row);
      board.appendChild(el);
    });
  }

  // Placed tiles
  tiles.forEach(tile => {
    const p=px(tile.col,tile.row);
    const el=document.createElement('div');
    el.className='stile';
    el.classList.add(tile.isHome?(tile.owner===0?'hp1':'hp2'):(tile.owner===0?'np1':'np2'));
    const side = tile.side || 0;
    const imgSuffix = side === 0 ? 'a' : 'b';
    el.style.cssText=`left:${p.left}px;top:${p.top}px;width:${CELL}px;height:${CELL}px;`;

    // Rotating background image
    const bgWrap = document.createElement('div'); bgWrap.className = 'stile-bg';
    const bgImg  = document.createElement('div'); bgImg.className  = 'stile-bg-img';
    bgImg.style.backgroundImage = `url('tiles/${tile.tileDefId}_${imgSuffix}.png')`;
    bgImg.style.transform       = `rotate(${tile.rotation || 0}deg)`;
    bgWrap.appendChild(bgImg); el.appendChild(bgWrap);

    if (tile.isHome) {
      const hb=document.createElement('div'); hb.className='hbadge'; hb.textContent='\u{1F3E0}'; el.appendChild(hb);
    }
    const cb=document.createElement('div'); cb.className='tcoord';
    const sideLabel = side===1?' [B]':'';
    cb.textContent=tile.key+(tile.rotation?` ${tile.rotation}\u00b0`:'')+sideLabel; el.appendChild(cb);

    const inner=document.createElement('div'); inner.className='stilei';

    const rotAreas = getRotatedAreas(tile);
    rotAreas.forEach((area, displayIdx) => {
      const realIdx = tile.areas.indexOf(area);
      const ae=document.createElement('div');
      ae.className=`tarea a${area.type}`;

      const cap = area.capacity;
      const used = area.troops.length;
      const lbl=document.createElement('div'); lbl.className='atlbl';
      if (area.type==='planet') {
        const capMark = '\u25cf'.repeat(cap);
        const incMark = area.income   > 0 ? ` <span class="inc-mark">\u25cf${area.income}</span>`   : '';
        const valMark = area.valuable > 0 ? ` <span class="val-mark">\u25c6${area.valuable}</span>` : '';
        let lblHTML = capMark + incMark + valMark;
        if (area.support)  lblHTML += ' <span class="tok-sup">\u2295</span>';
        if (area.discount) lblHTML += ' <span class="tok-dis">\u2296</span>';
        if (area.forge)    lblHTML += ' <span class="tok-frg">\u2692</span>';
        if (area.joker)    lblHTML += ' <span class="tok-jok">\u2605</span>';
        lbl.innerHTML = lblHTML;
      } else {
        lbl.textContent = '\u2736';
      }
      ae.appendChild(lbl);
      const capEl=document.createElement('div'); capEl.className='acap';
      capEl.textContent=`${used}/${cap}`;
      if (used>=cap) capEl.style.color='var(--accent2)';
      ae.appendChild(capEl);

      // Structures
      (area.structures||[]).forEach(s => {
        const info = STRUCTURE_INFO[s.type] || { icon:'?', label:s.type };
        const tok=document.createElement('div');
        tok.className='astruc';
        const sFacColor = FACTIONS.find(f=>f.id===G.players[s.player].faction)?.color || (s.player===0?'#00c8ff':'#ff4d6d');
        tok.style.background = hexAlpha(sFacColor, 0.5);
        tok.style.borderColor = sFacColor;
        tok.style.color = getTextColor(sFacColor);
        tok.textContent=info.icon; tok.title=info.label;
        ae.appendChild(tok);
      });

      // Troops
      area.troops.forEach(u => {
        const tok=document.createElement('div');
        const uFac = FACTIONS.find(f=>f.id===G.players[u.player].faction);
        const uColor = uFac?.color || (u.player===0?'#00c8ff':'#ff4d6d');
        tok.className=`atroop ${u.unitType}`;
        tok.style.background = hexAlpha(uColor, 0.15);
        tok.style.borderColor = uColor;
        tok.style.color = uColor;
        tok.textContent=`T${u.tier??0}`;
        tok.title=getUnitName(G.players[u.player].faction, u.unitType, u.tier??0);
        ae.appendChild(tok);
      });

      // Ownership highlight
      const h1=area.troops.some(t=>t.player===0), h2=area.troops.some(t=>t.player===1);
      if (h1&&h2) ae.classList.add('contested');
      else if (h1) ae.classList.add('h1');
      else if (h2) ae.classList.add('h2');

      // Подсветка допустимых зон при размещении войск
      if (G.phase === 'troop-on-tile' && tile.key === G.lastKey) {
        const cp2 = G.players[G.curP];
        if (G.selUnitIdx !== null) {
          const u = cp2.pool[G.selUnitIdx];
          if (u) ae.classList.add(isCompatible(u, area.type) && area.troops.length < area.capacity ? 'aok' : 'ano');
        } else if (G.selStructIdx !== null) {
          ae.classList.add(area.type === 'planet' && (!area.structures || area.structures.length === 0) ? 'aok' : 'ano');
        } else if (tile.needsObjective && !tile.objectiveMarker) {
          // Подсветить области для метки цели
          const eligIdxs = getObjectiveEligibleDisplayIdxs(tile);
          if (eligIdxs.includes(displayIdx) && area.type === 'planet') ae.classList.add('aok-obj');
        }
      }

      // Метка цели
      if (tile.objectiveMarker && tile.objectiveMarker.realAreaIdx === realIdx) {
        const opPlayer = tile.objectiveMarker.owner;
        const opFac = FACTIONS.find(f => f.id === G.players[opPlayer].faction);
        const opColor = opFac?.color || (opPlayer === 0 ? '#00c8ff' : '#ff4d6d');
        const opIcon = opFac?.icon || (opPlayer === 0 ? 'P1' : 'P2');
        const marker = document.createElement('div');
        marker.className = 'obj-marker';
        marker.style.background = hexAlpha(opColor, 0.25);
        marker.style.borderColor = opColor;
        marker.style.color = opColor;
        marker.textContent = opIcon;
        marker.title = `Цель: ${G.players[opPlayer].name}`;
        ae.appendChild(marker);
      }

      ae.onclick=()=>areaClick(tile.key, displayIdx);
      inner.appendChild(ae);
    });

    el.appendChild(inner);

    // Центральная зона — размещение приказов (клик отправляет на API)
    const centerZone = document.createElement('div');
    centerZone.style.cssText = `
      position: absolute;
      left: 50%;
      top: 50%;
      width: 60px;
      height: 60px;
      transform: translate(-50%, -50%);
      cursor: ${G.phase === 'order-placement' ? 'pointer' : 'default'};
      z-index: 5;
    `;
    if (G.phase === 'order-placement') {
      centerZone.onclick = (e) => {
        e.stopPropagation();
        placeOrderViaAPI(tile.key);
      };
    }
    el.appendChild(centerZone);

    // Отрисовка приказов на тайле (стопка в центре, смещение вверх-вправо)
    const tilesOrders = G.orders.filter(o => o.tile === tile.key);
    tilesOrders.forEach((order, idx) => {
      const orderEl = document.createElement('div');
      const fac = FACTIONS.find(f => f.id === G.players[order.owner].faction);
      const facIcon = fac?.icon || (order.owner === 0 ? 'P1' : 'P2');
      const orderName = ORDER_TYPES[order.type]?.name || order.type;
      const orderAbbrev = orderName.substring(0, 3).toUpperCase();  // первые 3 буквы

      // Смещение для стопки: каждый выше и правее (вверх-вправо)
      const offsetY = -idx * 5;  // вверх
      const offsetX = idx * 5;   // вправо

      orderEl.className = `order-fd`;
      orderEl.style.cssText = `
        position: absolute;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1px;
        font-family: 'Orbitron', monospace;
        pointer-events: none;
        top: calc(50% + ${offsetY}px);
        left: calc(50% + ${offsetX}px);
        transform: translate(-50%, -50%);
        box-shadow: 0 2px 10px rgba(0,0,0,.85), inset 0 0 0 6px #444;
        z-index: ${10 + idx};
        background: #1a1a1a;
        border: 2px solid #333;
        color: ${fac?.color || (order.owner === 0 ? '#00c8ff' : '#ff4d6d')};
        clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
      `;
      // Рубашка вверх - иконка фракции ЦВЕТОМ ФРАКЦИИ
      orderEl.innerHTML = `
        <div style="font-size: 2rem; font-weight: bold; line-height: 1;">${facIcon}</div>
      `;
      orderEl.title = `${orderName} (${G.players[order.owner].name})`;
      el.appendChild(orderEl);
    });

    // Варп-штормы: визуализация + кликабельные границы в фазе warp-storm
    ['top','bottom','left','right'].forEach(side => {
      const isH = side === 'top' || side === 'bottom';
      const hasWS = G.warpStorms.some(ws => ws.tileKey === tile.key && ws.side === side);
      if (hasWS) {
        const ws = document.createElement('div');
        ws.className = `warp-storm warp-storm-${side} ${isH ? 'warp-storm-h' : 'warp-storm-v'}`;
        el.appendChild(ws);
      }
      const canPlaceWS = G.phase === 'warp-storm' && !hasWS && !G.warpStorms.some(ws => ws.owner === G.curP) && !G.warpConfirmed[G.curP];
      if (canPlaceWS) {
        const border = document.createElement('div');
        border.className = `ws-border ws-border-${isH ? 'h' : 'v'} warp-storm-${side}`;
        border.onclick = (e) => { e.stopPropagation(); placeWarpStorm(tile.key, side); };
        el.appendChild(border);
      }
    });

    board.appendChild(el);
  });
}

// ── Tile hover preview ────────────────────────────────────────────────────────
let _tileHoverTimer = null;
let _tileHideTimer = null;
function _startTileHover(el, tileDefId) {
  _cancelTileHideTimer();
  _tileHoverTimer = setTimeout(() => { _showTilePreviewPopup(el, tileDefId); _tileHoverTimer = null; }, 1000);
}
function _cancelTileHover() {
  if (_tileHoverTimer) { clearTimeout(_tileHoverTimer); _tileHoverTimer = null; }
  _scheduleTileHide();
}
function _cancelTileHideTimer() {
  if (_tileHideTimer) { clearTimeout(_tileHideTimer); _tileHideTimer = null; }
}
function _scheduleTileHide() {
  _cancelTileHideTimer();
  _tileHideTimer = setTimeout(() => { _dismissTilePreview(); _tileHideTimer = null; }, 1000);
}
function _dismissTilePreview() {
  const old = document.getElementById('tile-peek-popup'); if (old) old.remove();
}
function _showTilePreviewPopup(anchorEl, tileDefId) {
  const old = document.getElementById('tile-peek-popup'); if (old) old.remove();
  const tileDef = TILE_CATALOG.find(t => t.id === tileDefId); if (!tileDef) return;
  const areas = tileDefToAreas(tileDef.sides[0]);
  const pop = document.createElement('div');
  pop.id = 'tile-peek-popup';
  pop.style.cssText = 'position:fixed;z-index:900;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:14px;box-shadow:0 0 28px rgba(255,215,0,.3);';
  const ttl = document.createElement('div');
  ttl.style.cssText = "font-family:'Orbitron',monospace;font-size:.6rem;color:var(--gold);letter-spacing:.2em;margin-bottom:8px;text-align:center;";
  ttl.textContent = tileDef.isHome ? 'ДОМАШНИЙ МИР' : 'СИСТЕМА';
  pop.appendChild(ttl);
  const grid = document.createElement('div'); grid.className = 'tile-peek-grid';
  areas.forEach(a => {
    const c = document.createElement('div');
    c.className = 'tile-peek-cell ' + a.type;
    if (a.type === 'planet') {
      let html = `<div>🪐</div><div>${'●'.repeat(a.capacity||2)}</div>`;
      if (a.income>0) html += `<div class="inc-mark">+${a.income}</div>`;
      if (a.support) html += `<div class="tok-sup">П</div>`;
      if (a.discount) html += `<div class="tok-dis">С</div>`;
      if (a.forge) html += `<div class="tok-frg">М</div>`;
      if (a.joker) html += `<div class="tok-jok">Д</div>`;
      c.innerHTML = html;
    } else { c.innerHTML = '<div style="font-size:1.2rem;color:var(--dim)">✦</div>'; }
    grid.appendChild(c);
  });
  pop.appendChild(grid);
  const hint = document.createElement('div');
  hint.style.cssText = 'color:var(--dim);font-size:.6rem;text-align:center;margin-top:6px;';
  hint.textContent = 'Нажмите для закрытия';
  pop.appendChild(hint);
  pop.onclick = () => { _cancelTileHideTimer(); pop.remove(); };
  pop.addEventListener('mouseenter', _cancelTileHideTimer);
  pop.addEventListener('mouseleave', _scheduleTileHide);
  document.body.appendChild(pop);
  const rect = anchorEl.getBoundingClientRect();
  let lft = rect.right + 8, top = rect.top;
  if (lft + 250 > window.innerWidth) lft = rect.left - 250;
  if (top + 270 > window.innerHeight) top = window.innerHeight - 275;
  pop.style.left = Math.max(0, lft) + 'px';
  pop.style.top = Math.max(0, top) + 'px';
}

// ══════════════════════════════════════════════
//  RENDER SIDE PANEL
// ══════════════════════════════════════════════
function renderSide() {
  _cancelTileHover(); _cancelTileHideTimer(); _dismissTilePreview();
  const cp = G.players[G.curP];

  // В фазе размещения войск — показываем пул, скрываем руку тайлов
  const poolSection   = document.getElementById('unit-pool-section');
  const structSection = document.getElementById('struct-pool-section');
  if (G.phase === 'troop-on-tile') {
    document.getElementById('tile-hand').innerHTML = '';

    // Пул юнитов
    const poolEl = document.getElementById('unit-pool');
    poolSection.style.display = 'block';
    poolEl.innerHTML = '';
    if (cp.pool.length > 0) {
      cp.pool.forEach((u, idx) => {
        const tok = document.createElement('div');
        const fac = FACTIONS.find(f=>f.id===cp.faction);
        const facColor = fac?.color || (G.curP===0?'#00c8ff':'#ff4d6d');
        tok.className = `ttok ${u.unitType}${G.selUnitIdx===idx?' sel':''}`;
        tok.style.background = hexAlpha(facColor, 0.15);
        tok.style.borderColor = facColor;
        tok.style.color = facColor;
        tok.textContent = `T${u.tier??0}`;
        tok.title = getUnitName(cp.faction, u.unitType, u.tier??0);
        tok.onclick = () => selectUnitFromPool(idx);
        poolEl.appendChild(tok);
      });
    } else {
      poolEl.innerHTML = '<span style="color:var(--dim);font-size:.75rem">Нет войск</span>';
    }

    // Пул построек
    const structEl = document.getElementById('struct-pool');
    if (cp.structurePool && cp.structurePool.length > 0) {
      structSection.style.display = 'block';
      structEl.innerHTML = '';
      cp.structurePool.forEach((s, idx) => {
        const info = STRUCTURE_INFO[s.type] || { icon:'?', label:s.type };
        const tok = document.createElement('div');
        tok.className = `ttok stok ${G.curP===0?'c1':'c2'}${G.selStructIdx===idx?' sel':''}`;
        tok.innerHTML = info.icon;
        tok.title = info.label;
        tok.onclick = () => selectStructFromPool(idx);
        structEl.appendChild(tok);
      });
    } else {
      structSection.style.display = 'none';
    }
    return;
  }

  // В фазе расстановки приказов — показываем приказы через API
  if (G.phase === 'order-placement') {
    document.getElementById('tile-hand').innerHTML = '';
    poolSection.style.display = 'block';
    structSection.style.display = 'none';

    const poolEl = document.getElementById('unit-pool');
    poolEl.innerHTML = '';

    // Раздел 1: Приказы в руке
    if (cp.hand_orders && cp.hand_orders.length > 0) {
      cp.hand_orders.forEach((order, idx) => {
        const btn = document.createElement('button');
        const orderName = ORDER_TYPES[order.type]?.name || order.type;
        const isSelected = _selectedOrderForPlacement?.id === order.id;
        const isDisabled = _orderPlacedThisTurn;

        btn.className = `abtn ${G.curP===0?'bp':'br'}`;
        btn.style.width = '100%';
        btn.style.marginBottom = '4px';
        btn.textContent = `${ORDER_TYPES[order.type]?.icon || '?'} ${orderName}`;
        btn.title = `${orderName} #${idx+1}`;
        btn.disabled = isDisabled;

        if (isSelected) {
          btn.style.filter = 'brightness(1.3)';
          btn.style.boxShadow = '0 0 8px currentColor';
        }

        if (!isDisabled) {
          btn.onclick = () => selectOrderForPlacement(idx, order);
        }

        poolEl.appendChild(btn);
      });
    } else {
      poolEl.innerHTML = '<span style="color:var(--dim);font-size:.75rem">Приказы выставлены</span>';
    }

    // Раздел 2: Приказы на поле (только текущего игрока)
    const ordersOnField = G.orders.filter(o => o.owner === G.curP);
    if (ordersOnField.length > 0) {
      const divider = document.createElement('div');
      divider.style.cssText = 'margin-top:10px;padding-top:8px;border-top:1px solid var(--border);';

      const title = document.createElement('div');
      title.className = 'ptitle';
      title.textContent = 'ПРИКАЗЫ НА ПОЛЕ';
      divider.appendChild(title);

      // Группируем приказы по системам
      const ordersByTile = {};
      ordersOnField.forEach(o => {
        if (!ordersByTile[o.tile]) ordersByTile[o.tile] = [];
        ordersByTile[o.tile].push(o);
      });

      // Выводим каждую систему с приказами
      Object.entries(ordersByTile).sort().forEach(([tileKey, orders]) => {
        const tileInfo = document.createElement('div');
        tileInfo.style.cssText = 'margin-top:6px;padding:6px;background:rgba(255,255,255,.05);border-radius:4px;font-size:.75rem;';

        const tileLabel = document.createElement('div');
        tileLabel.style.cssText = 'font-weight:bold;color:var(--gold);margin-bottom:3px;';
        tileLabel.textContent = `📍 [${tileKey}]`;
        tileInfo.appendChild(tileLabel);

        // Приказы в этой системе
        orders.forEach((o, i) => {
          const orderDisplay = document.createElement('div');
          const orderType = ORDER_TYPES[o.type];
          const abbrev = (orderType?.name || o.type).substring(0, 3).toUpperCase();
          orderDisplay.style.cssText = `color:var(--dim);font-size:.7rem;margin-left:4px;`;
          orderDisplay.textContent = `${i+1}. ${orderType?.icon || '?'} ${abbrev}`;
          tileInfo.appendChild(orderDisplay);
        });

        divider.appendChild(tileInfo);
      });

      poolEl.appendChild(divider);
    }

    return;
  }

  // В других фазах — скрыть пул
  if (poolSection)   poolSection.style.display   = 'none';
  if (structSection) structSection.style.display = 'none';

  // Tile hand
  const handEl = document.getElementById('tile-hand');
  handEl.innerHTML = '';
  cp.hand.forEach((ht,idx) => {
    if (ht.placed) return;
    const el=document.createElement('div');
    el.className=`htile${ht.isHome?' hthome':''}`;
    if (G.selHandIdx===idx) el.classList.add(cp.color==='c1'?'hs1':'hs2');
    const tileDef=TILE_CATALOG.find(t=>t.id===ht.tileDefId);
    const sideLayout=tileDef?tileDef.sides[0].layout.flat():[];
    const prev=document.createElement('div'); prev.className='hpreview';
    sideLayout.forEach(v=>{ const d=document.createElement('div'); d.className=`hpa ${v===1?'hpp':'hps'}`; prev.appendChild(d); });
    const lbl=document.createElement('div'); lbl.className='htlabel';
    const fac=FACTIONS.find(f=>f.id===cp.faction);
    lbl.textContent=ht.isHome?`${fac?.icon} \u0414\u043e\u043c\u0430\u0448\u043d\u044f\u044f`:`\u0421\u0438\u0441\u0442\u0435\u043c\u0430 ${idx+1}`;
    el.appendChild(prev); el.appendChild(lbl);
    el.onclick=()=>selectHandTile(idx);
    el.addEventListener('mouseenter', () => _startTileHover(el, ht.tileDefId));
    el.addEventListener('mouseleave', _cancelTileHover);
    handEl.appendChild(el);
  });
}

function updateHeader() {
  const cp=G.players[G.curP];
  [0,1].forEach(pi=>{
    const p=G.players[pi], pfx=pi===0?'p1':'p2';
    document.getElementById(`h-${pfx}-name`).textContent=p.name;
    document.getElementById(`h-${pfx}-init`).textContent=p.name.substring(0,2).toUpperCase();
    const fac=FACTIONS.find(f=>f.id===p.faction);
    document.getElementById(`h-${pfx}-fac`).textContent=fac?`${fac.icon} ${fac.name}`:'—';
    const resEl = document.getElementById(`h-${pfx}-res`);
    if (resEl) {
      const parts = [];
      if (p.credits != null) parts.push(`💰${p.credits}`);
      if (p.tokens?.support)  parts.push(`⊕${p.tokens.support}`);
      if (p.tokens?.discount) parts.push(`⊖${p.tokens.discount}`);
      if (p.tokens?.forge)    parts.push(`⚒${p.tokens.forge}`);
      resEl.textContent = parts.join('  ') || '';
    }
  });
  const hRound = document.getElementById('h-round'); if (hRound) hRound.textContent='';
  const edsp = document.getElementById('event-stack-disp');
  if (edsp) edsp.style.display='none';
}
