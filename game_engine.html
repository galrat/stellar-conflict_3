<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR CONFLICT</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- SETUP -->
<div id="setup-screen" class="screen active">
  <h1 class="game-title">STELLAR CONFLICT</h1>
  <p class="game-subtitle">tactical wargame · hotseat edition</p>
  <div class="setup-players">
    <div class="player-setup ps1">
      <div class="player-label">◈ Командир I</div>
      <div class="field-group"><div class="field-label">Позывной</div><input type="text" id="p1-name" value="Alpha" oninput="document.getElementById('fp-name-0').textContent=this.value||'Alpha'"></div>
      <div class="field-group"><div class="field-label">Фракция</div><div class="faction-select" id="p1-factions"></div></div>
    </div>
    <div class="player-setup ps2">
      <div class="player-label">◈ Командир II</div>
      <div class="field-group"><div class="field-label">Позывной</div><input type="text" id="p2-name" value="Omega" oninput="document.getElementById('fp-name-1').textContent=this.value||'Omega'"></div>
      <div class="field-group"><div class="field-label">Фракция</div><div class="faction-select" id="p2-factions"></div></div>
    </div>
  </div>
  <div class="fp-select" id="fp-select">
    <span>Первый ход:</span>
    <label class="fp-label fp-p1 active" id="fp-lbl-0" onclick="pickFirstPlayer(0)">
      <input type="radio" name="first-player" value="0" checked style="display:none"> <span id="fp-name-0">Alpha</span>
    </label>
    <label class="fp-label fp-p2" id="fp-lbl-1" onclick="pickFirstPlayer(1)">
      <input type="radio" name="first-player" value="1" style="display:none"> <span id="fp-name-1">Omega</span>
    </label>
  </div>
  <div style="display:flex;gap:10px;width:100%;max-width:980px;">
    <button class="start-btn" onclick="startGame()" style="flex:1;">▶ НАЧАТЬ ИГРУ</button>
    <button class="start-btn" onclick="loadGame()" style="flex:0 0 auto;width:200px;background:linear-gradient(135deg,rgba(0,200,255,.07),rgba(255,215,0,.07));border-color:rgba(255,215,0,.3);">📂 ЗАГРУЗИТЬ</button>
  </div>
</div>

<!-- GAME -->
<div id="game-screen" class="screen">
  <div class="game-header">
    <div class="pinfo s1">
      <div class="pavatar av1" id="h-p1-init">P1</div>
      <div class="pstats s1">
        <div class="pname" id="h-p1-name">Alpha</div>
        <div class="pfac"  id="h-p1-fac">—</div>
        <div class="pres" id="h-p1-res"></div>
      </div>
    </div>
    <div class="phase-info">
      <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;">
        <button class="abtn bp" style="font-size:.6rem;padding:3px 10px;" onclick="saveGame()">💾 Сохранить</button>
        <button class="abtn bw" style="font-size:.6rem;padding:3px 10px;" onclick="loadGame()">📂 Загрузить</button>
      </div>
    </div>
    <div class="pinfo r s2">
      <div class="pstats s2" style="text-align:right">
        <div class="pname" id="h-p2-name">Omega</div>
        <div class="pfac"  id="h-p2-fac">—</div>
        <div class="pres" id="h-p2-res"></div>
      </div>
      <div class="pavatar av2" id="h-p2-init">P2</div>
    </div>
  </div>

  <!-- Corner card panels -->
  <div class="corner-panel corner-p1" id="corner-p1">
    <button class="abtn bp" onclick="showBattleCards(0)" title="Боевые карты">🎴 Карты</button>
    <button class="abtn bp" onclick="showOrderUpgrades(0)" title="Улучшения приказов">⚔ Приказы</button>
    <button class="abtn bp" onclick="showEventCards(0)" title="Карты событий">🃏 События</button>
  </div>
  <div class="corner-panel corner-p2" id="corner-p2">
    <button class="abtn br" onclick="showBattleCards(1)" title="Боевые карты">🎴 Карты</button>
    <button class="abtn br" onclick="showOrderUpgrades(1)" title="Улучшения приказов">⚔ Приказы</button>
    <button class="abtn br" onclick="showEventCards(1)" title="Карты событий">🃏 События</button>
  </div>

  <div class="game-content">
    <div class="side-panel" id="left-panel">
      <div class="ptitle">Системы в руке</div>
      <div class="tile-hand" id="tile-hand"></div>
      <div id="unit-pool-section" style="display:none">
        <div class="ptitle" style="margin-top:10px">Резерв войск</div>
        <div class="tpool" id="unit-pool" style="display:flex;flex-wrap:wrap;gap:5px;padding:6px 0;"></div>
      </div>
      <div id="struct-pool-section" style="display:none">
        <div class="ptitle" style="margin-top:8px">Постройки</div>
        <div class="tpool" id="struct-pool" style="display:flex;flex-wrap:wrap;gap:5px;padding:4px 0;"></div>
      </div>
    </div>
    <div class="map-container" style="position:relative;">
      <div class="map-board" id="map-board"></div>
    </div>
    <div class="side-panel">
      <div class="ptitle">Журнал событий</div>
      <div class="alog" id="alog"></div>
    </div>
  </div>

  <div class="bottom-bar">
    <div class="pinstr" id="pinstr">—</div>
    <button class="abtn bw" id="btn-ut"   onclick="undoTile()"       style="display:none">↩ Вернуть систему</button>
    <button class="abtn bw" id="btn-uu"   onclick="undoLastUnit()"   style="display:none">↩ Вернуть войско</button>
    <button class="abtn bp" id="btn-fl"   onclick="flipTile()"       style="display:none">⇄ Перевернуть</button>
    <button class="abtn bp" id="btn-rccw" onclick="rotateTile(false)" style="display:none">↺ Повернуть</button>
    <button class="abtn bp" id="btn-rcw"  onclick="rotateTile(true)"  style="display:none">↻ Повернуть</button>
    <button class="abtn bp" id="btn-et"   onclick="endTurn()"           style="display:none">Готово →</button>
    <button class="abtn bw" id="btn-undo-ws" onclick="undoWarpStorm()" style="display:none">↩ Отменить варп-шторм</button>
    <button class="abtn bp" id="btn-confirm-ws" onclick="confirmWarpStorm()" style="display:none">Подтвердить ✓</button>
    <button class="abtn bw" id="btn-undo-order" onclick="undoLastOrderViaAPI()" style="display:none">↩ Вернуть приказ</button>
    <button class="abtn bw" id="btn-discard-order" onclick="discardOrderViaAPI()" style="display:none">🗑 Сбросить приказ</button>
    <button class="abtn bp" id="btn-pass" onclick="passOrderTurn()" style="display:none">Передать ход →</button>
    <button class="abtn bg" id="btn-next-round" onclick="nextRoundViaAPI()" style="display:none">Следующий раунд →</button>
  </div>
</div>

<!-- END -->
<div id="end-screen" class="screen">
  <div class="end-content">
    <div class="wtitle">ПОБЕДИТЕЛЬ</div>
    <div class="wname" id="end-winner">—</div>
    <div class="sgrid" id="end-scores"></div>
    <button class="start-btn" onclick="restartGame()">↺ НОВАЯ ИГРА</button>
  </div>
</div>

<!-- Hotpass overlay -->
<div class="hpoverlay" id="hpov">
  <div class="hpsub">ПЕРЕДАТЬ ХОД</div>
  <div class="hpname" id="hp-name">—</div>
  <div class="hpsub" id="hp-action">Ваш ход</div>
  <button class="hpbtn" id="hp-btn" onclick="closeHP()">ГОТОВ ▶</button>
</div>

<!-- Msg modal -->
<div class="moverlay" id="msg-modal">
  <div class="modal">
    <h2 id="msg-title">Info</h2>
    <p id="msg-body"></p>
    <div class="mbtns"><button class="abtn bp" onclick="closeMsg()">OK</button></div>
  </div>
</div>

<script src="tiles.js"></script>
<script src="stage1.js"></script>
<script src="game.js"></script>
<script>G = makeState(); buildFactionUI();</script>
</body>
</html>
